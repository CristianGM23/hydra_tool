<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HYDRA — Arquitectura</title>
<meta name="description" content="Punto de entrada único a la arquitectura de HYDRA: vista general, catálogo de capacidades y catálogo de procesos, en ES/EN, con exploración por capas y evidencia de código." />
<style>
  :root{
    --bg:#f3f4f1; --panel:#ffffff; --ink:#15181c; --ink-dim:#5b6472;
    --line:#d8dcd3; --accent:#1f8a6f; --accent-ink:#ffffff;
    --chip:#eef1ec; --chip-ink:#374151; --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;
    --sidebar-w:380px; --header-h:56px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14171a; --panel:#1b1f23; --ink:#eef0ee; --ink-dim:#9aa4ab;
      --line:#2b3136; --accent:#39b790; --accent-ink:#06120d;
      --chip:#20262b; --chip-ink:#c7cdd1;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171a; --panel:#1b1f23; --ink:#eef0ee; --ink-dim:#9aa4ab;
    --line:#2b3136; --accent:#39b790; --accent-ink:#06120d;
    --chip:#20262b; --chip-ink:#c7cdd1;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
  }
  header{
    flex:0 0 auto; display:flex; align-items:center; gap:16px;
    padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel);
    flex-wrap:wrap; row-gap:8px; min-height:var(--header-h);
  }
  .brand{display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; white-space:nowrap;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;}
  .seg{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .seg button{
    appearance:none; border:none; background:transparent; color:var(--ink-dim);
    font:inherit; font-weight:600; padding:8px 14px; cursor:pointer; white-space:nowrap;
    border-right:1px solid var(--line);
  }
  .seg button:last-child{border-right:none;}
  .seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink);}
  .seg button:hover:not([aria-pressed="true"]){background:var(--chip); color:var(--ink);}
  .spacer{flex:1 1 auto;}
  .ghost-btn{
    appearance:none; border:1px solid var(--line); background:var(--panel); color:var(--ink);
    font:inherit; font-weight:600; padding:8px 12px; border-radius:8px; cursor:pointer; white-space:nowrap;
  }
  .ghost-btn:hover{background:var(--chip);}
  .ghost-btn.small{font-size:12px; padding:6px 10px; font-weight:600;}
  main{flex:1 1 auto; display:flex; min-height:0; position:relative;}
  .view{flex:1 1 auto; display:flex; min-height:0; min-width:0;}
  .stage{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; position:relative;}
  .stage iframe{flex:1 1 auto; width:100%; height:100%; border:none; background:var(--panel);}
  .stage .hint{
    position:absolute; left:12px; bottom:12px; font-size:12px; color:var(--ink-dim);
    background:color-mix(in srgb, var(--panel) 85%, transparent); padding:4px 8px; border-radius:6px;
    border:1px solid var(--line); pointer-events:none;
  }
  aside{
    width:var(--sidebar-w); flex:0 0 auto; border-left:1px solid var(--line); background:var(--panel);
    display:flex; flex-direction:column; min-height:0;
  }
  aside .sidebar-head{padding:14px 16px 8px; border-bottom:1px solid var(--line); flex:0 0 auto;}
  aside .sidebar-head h2{margin:0 0 4px; font-size:14px;}
  aside .sidebar-head p{margin:0; font-size:12px; color:var(--ink-dim);}
  .search{
    margin:10px 16px 0; display:flex; align-items:center; gap:6px;
    border:1px solid var(--line); border-radius:8px; padding:6px 10px; flex:0 0 auto;
  }
  .search input{border:none; outline:none; background:transparent; color:var(--ink); font:inherit; width:100%;}
  .comp-list{overflow-y:auto; padding:10px 16px 24px; flex:1 1 auto;}
  .card{border:1px solid var(--line); border-radius:10px; margin-bottom:10px; overflow:hidden; background:var(--panel);}
  .card[data-kind="external"]{border-color:#c9994a66;}
  .card[data-kind="security"]{border-color:#c2555566;}
  .card[data-kind="database"]{border-color:#4a7ac966;}
  .card summary{
    list-style:none; cursor:pointer; padding:10px 12px; display:flex; align-items:center; gap:8px;
  }
  .card summary::-webkit-details-marker{display:none;}
  .card summary::before{content:"▸"; color:var(--ink-dim); font-size:11px; transition:transform .15s;}
  .card[open] > summary::before{transform:rotate(90deg);}
  .kind-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  .kind-dot.frontend{background:#4a90c9;}
  .kind-dot.backend{background:#1f8a6f;}
  .kind-dot.database{background:#4a7ac9;}
  .kind-dot.security{background:#c25555;}
  .kind-dot.external{background:#c9994a;}
  .kind-dot.messagebus{background:#8a5fc9;}
  .kind-dot.cloud{background:#2aa7a0;}
  .card summary .label{font-weight:700; font-size:13px; flex:1 1 auto;}
  .card summary .tag{font-size:10px; color:var(--ink-dim); border:1px solid var(--line); border-radius:999px; padding:1px 7px;}
  .tier-body{padding:0 12px 12px;}
  .tier{border-top:1px solid var(--line); padding:10px 0 0; margin-top:10px;}
  .tier:first-child{border-top:none; margin-top:4px; padding-top:0;}
  .tier .tier-label{
    font-size:10px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--accent); margin-bottom:4px;
  }
  .tier .tier-text{font-size:12.5px; color:var(--ink); margin:0 0 6px;}
  .tier .tier-sub{font-size:12px; color:var(--ink-dim); margin:0;}
  .reveal-btn{
    appearance:none; border:1px dashed var(--line); background:transparent; color:var(--ink-dim);
    font:inherit; font-size:11.5px; padding:5px 10px; border-radius:7px; cursor:pointer; margin-top:2px;
  }
  .reveal-btn:hover{background:var(--chip); color:var(--ink);}
  .src-list{list-style:none; margin:6px 0 0; padding:0; display:flex; flex-direction:column; gap:4px;}
  .src-list li{
    font:11.5px/1.4 var(--mono); color:var(--ink-dim); background:var(--chip); border-radius:6px; padding:5px 8px;
    word-break:break-all;
  }
  .src-list .src-label{color:var(--ink); font-family:inherit; font-weight:600; display:block; margin-bottom:1px;}
  footer{
    flex:0 0 auto; border-top:1px solid var(--line); background:var(--panel); padding:8px 16px;
    font-size:11.5px; color:var(--ink-dim); display:flex; gap:14px; flex-wrap:wrap;
  }
  footer a{color:var(--ink-dim);}
  .hidden{display:none !important;}

  /* ---- Capabilities / Processes catalog views ---- */
  .list-panel{width:300px; flex:0 0 auto; border-right:1px solid var(--line); background:var(--panel); overflow-y:auto; padding:14px 12px;}
  .detail-panel{flex:1 1 auto; overflow-y:auto; padding:22px 28px; background:var(--bg);}
  .detail-panel .empty{color:var(--ink-dim); font-size:13px;}
  .nav-card{border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer; background:var(--panel);}
  .nav-card:hover{border-color:var(--accent);}
  .nav-card.active{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--panel));}
  .nav-card .nav-kind{font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.04em; display:flex; align-items:center; gap:6px;}
  .nav-card .nav-title{font-weight:700; font-size:13px; margin-top:3px;}
  .proc-group-label{font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-dim); margin:14px 2px 6px; }
  .proc-group-label:first-child{margin-top:2px;}
  .lvl-card{border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:16px; background:var(--panel); max-width:980px;}
  .lvl-card h3{margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--accent);}
  .lvl-card p{margin:0 0 8px; font-size:13px;}
  .lvl-card ul{margin:0 0 8px; padding-left:20px; font-size:13px;}
  .lvl-card ul li{margin-bottom:4px;}
  .detail-title{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .detail-title h2{margin:0; font-size:19px;}
  .concept{border-top:1px dashed var(--line); padding:12px 0;}
  .concept:first-child{border-top:none; padding-top:2px;}
  .concept h4{margin:0 0 6px; font-size:13.5px;}
  .concept .concept-field{font-size:12.5px; margin:0 0 5px; display:grid; grid-template-columns:128px 1fr; gap:4px 10px;}
  .concept .concept-field b{color:var(--ink-dim); font-weight:600;}
  .concept .concept-field ul{margin:0; padding-left:16px;}
  .related-link{display:inline-block; margin:4px 8px 0 0;}
  /* process flow */
  .flow-start,.flow-result{border:2px solid var(--accent); border-radius:10px; padding:12px 16px; margin-bottom:10px; background:var(--panel);}
  .flow-start .flow-kicker,.flow-result .flow-kicker{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--accent); font-weight:800;}
  .flow-stage{border:1px solid var(--line); border-left-width:5px; border-left-style:solid; border-radius:8px; padding:10px 14px; margin:0 0 8px 18px; background:var(--panel);}
  .flow-stage.optional{border-left-style:dashed; border-top-style:dashed; border-right-style:dashed; border-bottom-style:dashed;}
  .flow-stage .stage-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .flow-stage .stage-cap{font-size:10px; text-transform:uppercase; color:var(--ink-dim); letter-spacing:.03em;}
  .flow-stage .stage-opt-badge{font-size:10px; border:1px solid var(--line); border-radius:999px; padding:1px 7px; color:var(--ink-dim);}
  .flow-stage .stage-label{font-weight:700; font-size:13.5px; margin:3px 0 2px;}
  .flow-stage .stage-detail{font-size:12.5px; color:var(--ink-dim); margin:0;}
  .flow-branch{margin:0 0 10px 34px; font-size:12px; color:var(--ink-dim); border-left:2px dotted var(--line); padding-left:10px;}
  .flow-branch b{color:var(--ink);}
  .evidence-row{font:11.5px/1.4 var(--mono); color:var(--ink-dim); background:var(--chip); border-radius:6px; padding:5px 8px; margin-bottom:4px; word-break:break-all;}
  /* requiredness legend + badges (shared by Elements and Process views) */
  .req-badge{display:inline-block; font-size:10px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; padding:2px 8px; border-radius:999px; margin-left:8px; color:var(--ink); background:var(--chip);}
  .req-badge[data-req="MANDATORY"]{border:2px solid var(--accent);}
  .req-badge[data-req="OPTIONAL"]{border:2px dashed var(--ink-dim);}
  .req-badge[data-req="CONDITIONAL"]{border:2px dotted #c9994a;}
  .req-badge[data-req="ALTERNATIVE"]{border:2px double #4a90c9;}
  .req-badge[data-req="REPEATABLE"]{border:2px solid #8a5fc9;}
  .req-legend{display:flex; flex-wrap:wrap; gap:10px; font-size:11.5px; color:var(--ink-dim); margin-bottom:12px;}
  .req-legend .req-badge{margin-left:0;}
  .authoring-element{border-top:1px dashed var(--line); padding:10px 0;}
  .authoring-element:first-child{border-top:none;}
  .authoring-element h5{margin:0 0 6px; font-size:13px; display:flex; align-items:center; flex-wrap:wrap;}
  .authoring-mode{margin:0 0 6px 4px; padding:6px 10px; background:var(--chip); border-radius:8px;}
  .authoring-mode b{font-size:12px;}
  .authoring-mode p{margin:3px 0 0; font-size:12px; color:var(--ink-dim);}

  @media (max-width: 900px){
    main{flex-direction:column;}
    .view{flex-direction:column;}
    aside{width:100%; max-height:46vh; border-left:none; border-top:1px solid var(--line);}
    .list-panel{width:100%; max-height:34vh; border-right:none; border-bottom:1px solid var(--line);}
    .stage{min-height:40vh;}
  }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span> HYDRA — Arquitectura</div>
  <div class="seg" id="section-seg" role="tablist" aria-label="Sección">
    <button type="button" data-section="overview" aria-pressed="true"></button>
    <button type="button" data-section="capabilities" aria-pressed="false"></button>
    <button type="button" data-section="processes" aria-pressed="false"></button>
  </div>
  <div class="seg" id="level-seg" role="tablist" aria-label="Nivel">
    <button type="button" data-level="user" aria-pressed="true"></button>
    <button type="button" data-level="functional" aria-pressed="false"></button>
    <button type="button" data-level="technical" aria-pressed="false"></button>
  </div>
  <div class="seg" id="lang-seg" role="tablist" aria-label="Idioma">
    <button type="button" data-lang="es" aria-pressed="true">ES</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
  <div class="spacer"></div>
  <button type="button" class="ghost-btn" id="toggle-sidebar">Componentes ▸</button>
</header>

<main>
  <div class="view" id="view-overview">
    <div class="stage">
      <iframe id="level-frame" title="Diagrama de arquitectura de HYDRA"></iframe>
      <div class="hint" id="stage-hint"></div>
    </div>
    <aside id="sidebar">
      <div class="sidebar-head">
        <h2 id="sidebar-title">Explorar componentes</h2>
        <p id="sidebar-sub">Mismo ID canónico en los tres niveles. Progresión: qué hace → cómo funciona → cómo está implementado → evidencia.</p>
      </div>
      <div class="search">
        <span aria-hidden="true">🔎</span>
        <input type="search" id="comp-search" placeholder="Buscar componente…" />
      </div>
      <div class="comp-list" id="comp-list"></div>
    </aside>
  </div>

  <div class="view hidden" id="view-capabilities">
    <div class="list-panel" id="cap-list"></div>
    <div class="detail-panel" id="cap-detail"></div>
  </div>

  <div class="view hidden" id="view-processes">
    <div class="list-panel" id="proc-list"></div>
    <div class="detail-panel" id="proc-detail"></div>
  </div>
</main>

<footer>
  <span id="footer-provenance"></span>
  <span>·</span>

</footer>

    var qLang = params.get("lang");
    var qSection = params.get("section");

    var qProc = params.get("process");

  function t(key){
    var parts = key.split(".");
    var node = I18N[state.lang];
    for (var i=0;i<parts.length;i++){ node = node && node[parts[i]]; }
    return node;
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
    });
  }

  function kindDotClass(kind){ return "kind-dot " + kind; }

  function renderSourceList(sources){
    if (!sources || !sources.length) return "";
    var items = sources.map(function(s){
      var loc = s.path + (s.line ? ":" + s.line + (s.end_line ? "-" + s.end_line : "") : "");
      var label = s.label ? '<span class="src-label">' + escapeHtml(s.label) + "</span>" : "";
      return "<li>" + label + escapeHtml(loc) + "</li>";
    }).join("");
    return '<ul class="src-list">' + items + "</ul>";
  }

  function renderChrome(){
    document.documentElement.lang = state.lang;
    document.getElementById("sidebar-title").textContent = t("sidebarTitle");
    document.getElementById("sidebar-sub").textContent = t("sidebarSub");
    document.getElementById("comp-search").placeholder = t("search");
    document.getElementById("toggle-sidebar").textContent = state.sidebarOpen ? t("toggleHide") : t("toggleShow");
    document.getElementById("stage-hint").textContent = t("hint." + state.level);
    document.getElementById("footer-provenance").textContent = t("provenance");
    document.getElementById("footer-link-tech").textContent = t("openTab");
    document.getElementById("footer-link-tech").href = FRAME_SRC.technical[state.lang];
    document.getElementById("footer-link-readme").textContent = t("readme");

    var sectionLabelKeys = { overview: "sectionOverview", capabilities: "sectionCapabilities", processes: "sectionProcesses" };
    document.querySelectorAll("#section-seg button").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.dataset.section === state.section));
      b.textContent = t(sectionLabelKeys[b.dataset.section]);
    });

    var levelLabelKeys = { user: "levelUser", functional: "levelFunctional", technical: "levelTechnical" };
    document.querySelectorAll("#level-seg button").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.dataset.level === state.level));
      b.textContent = t(levelLabelKeys[b.dataset.level]);
    });
    document.querySelectorAll("#lang-seg button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)); });

    var isOverview = state.section === "overview";
    document.getElementById("view-overview").classList.toggle("hidden", !isOverview);
    document.getElementById("view-capabilities").classList.toggle("hidden", state.section !== "capabilities");
    document.getElementById("view-processes").classList.toggle("hidden", state.section !== "processes");
    document.getElementById("level-seg").classList.toggle("hidden", !isOverview);

    if (isOverview) {
      document.getElementById("level-frame").src = FRAME_SRC[state.level][state.lang];
      var showSidebar = state.sidebarOpen && !!ARCHITECTURE_LEVELS[state.level];
      document.getElementById("sidebar").classList.toggle("hidden", !showSidebar);
      document.getElementById("toggle-sidebar").classList.toggle("hidden", !ARCHITECTURE_LEVELS[state.level]);
    } else {
      document.getElementById("toggle-sidebar").classList.add("hidden");
    }
  }

  function renderSection(){
    if (state.section === "overview") {
      renderComponentList(document.getElementById("comp-search").value);

      renderCapList();
      renderCapDetail(state.selectedCapability);
    } else if (state.section === "processes") {
      renderProcList();
      renderProcDetail(state.selectedProcess);
    }
  }

  // Overview sidebar (unchanged behavior, plus a "jump to capability" link)
  // ---------------------------------------------------------------------
  function renderComponentList(filterText){
    var listEl = document.getElementById("comp-list");
    var lang = state.lang;
    var query = (filterText || "").trim().toLowerCase();
    var html = "";

    ORDER.forEach(function(id){
      var c = COMPONENTS[id];
      var userPair = c[lang].user;
      var funcPair = c[lang].functional;
      var techPair = c[lang].technical;
      var detailBullets = (c.detail && c.detail[lang]) || [];
      var limitsBullets = (c.limits && c.limits[lang]) || [];
      var relations = c.relations || [];
      var searchable = (id + " " + userPair[0] + " " + funcPair[0] + " " + techPair[0] + " " + detailBullets.join(" ")).toLowerCase();
      if (query && searchable.indexOf(query) === -1) return;

      var notInLevelNote = c.inUser ? "" : '<p class="tier-sub" style="margin-top:6px;font-style:italic;">' + escapeHtml(t("notInLevel")) + "</p>";
      var detailHtml = detailBullets.length
        ? '<ul style="margin:0 0 4px;padding-left:18px;">' + detailBullets.map(function(b){ return "<li class=\"tier-text\" style=\"margin-bottom:4px;\">" + escapeHtml(b) + "</li>"; }).join("") + "</ul>"
        : "";
      var limitsHtml = limitsBullets.length
        ? '<ul style="margin:0;padding-left:18px;">' + limitsBullets.map(function(b){ return "<li class=\"tier-text\" style=\"margin-bottom:4px;\">" + escapeHtml(b) + "</li>"; }).join("") + "</ul>"
        : "";
      var relationsHtml = relations.length
        ? '<ul style="margin:0;padding-left:18px;">' + relations.map(function(r){
            var targetLabel = (COMPONENTS[r.to] && COMPONENTS[r.to][lang] && COMPONENTS[r.to][lang].functional[0]) || r.to;
            return '<li class="tier-text" style="margin-bottom:4px;"><strong>&rarr; ' + escapeHtml(targetLabel) + ":</strong> " + escapeHtml(r[lang]) + "</li>";
          }).join("") + "</ul>"
        : '<p class="tier-sub">' + escapeHtml(t("noRelations")) + "</p>";

      var caps = CAP_BY_ARCH[id] || [];
      var capJumpHtml = "";
      if (caps.length) {
        capJumpHtml = '<div class="tier">' + caps.map(function(capId){
          return '<button type="button" class="ghost-btn small related-link" data-goto-cap="' + capId + '">' +
            escapeHtml(t("goToCapability")) + ": " + escapeHtml(CAPABILITY_NAMES[capId][lang]) + " →</button>";
        }).join("") + "</div>";
      }

      html += '<details class="card" data-kind="' + c.kind + '">';
      html += '<summary><span class="' + kindDotClass(c.kind) + '"></span>';
      html += '<span class="label">' + escapeHtml(funcPair[0]) + "</span>";
      html += '<span class="tag">' + id + "</span></summary>";
      html += '<div class="tier-body">';

      html += '<div class="tier">';
      html += '<div class="tier-label">' + t("tierWhat") + "</div>";
      html += detailHtml;
      html += notInLevelNote;
      html += "</div>";

      html += '<div class="tier">';
      html += '<div class="tier-label">' + t("tierLimits") + "</div>";
      html += limitsHtml;
      html += "</div>";

      html += '<div class="tier">';
      html += '<div class="tier-label">' + t("tierRelations") + "</div>";
      html += relationsHtml;
      html += "</div>";

      html += capJumpHtml;

      html += '<details class="tier-reveal"><summary class="reveal-btn" style="display:list-item;list-style:none;">' + t("revealHow") + "</summary>";
      html += '<div class="tier">';
      html += '<div class="tier-label">' + t("tierHow") + "</div>";
      html += '<p class="tier-text">' + escapeHtml(funcPair[0]) + "</p>";
      html += '<p class="tier-sub">' + escapeHtml(funcPair[1]) + "</p>";

      html += '<details class="tier-reveal"><summary class="reveal-btn" style="display:list-item;list-style:none;">' + t("revealImpl") + "</summary>";
      html += '<div class="tier">';
      html += '<div class="tier-label">' + t("tierImpl") + "</div>";

      html += '<p class="tier-sub">' + escapeHtml(techPair[1]) + "</p>";
      html += "</div>";

      html += '<details class="tier-reveal"><summary class="reveal-btn" style="display:list-item;list-style:none;">' + t("revealSrc") + "</summary>";
      html += '<div class="tier">';

      html += "</div></details>"; // tier-body, card

    var html = "<p>" + escapeHtml(authoring.summary) + "</p>";
    html += renderRequirednessLegend();
    html += (authoring.elements || []).map(function(el){
      var modesHtml = (el.modes || []).map(function(m){
        return '<div class="authoring-mode"><b>' + escapeHtml(m.mode) + "</b><p>" + escapeHtml(m.detail) + "</p></div>";
      }).join("");
      return '<div class="authoring-element"><h5>' + escapeHtml(el.element) + renderRequirednessBadge(el.requiredness) + "</h5>" +
        '<div class="concept-field"><b>' + t("authoringModes") + "</b><span>" + modesHtml + "</span></div></div>";
    }).join("");
    return html;
  }

  function renderConcept(c, lang){
    var ioLine = c.io ? (escapeHtml(c.io.inputs || "") + " → " + escapeHtml(c.io.outputs || "")) : "";
    var propsHtml = (c.properties || []).length ? '<ul>' + c.properties.map(function(p){ return "<li>" + escapeHtml(p) + "</li>"; }).join("") + "</ul>" : "—";
    var relHtml = (c.relationships || []).length ? '<ul>' + c.relationships.map(function(r){ return "<li>" + escapeHtml(r) + "</li>"; }).join("") + "</ul>" : "—";
    var evidenceHtml = (c.evidence || []).length
      ? c.evidence.map(function(ev){
          var loc = ev.path + (ev.line ? ":" + ev.line + (ev.end_line ? "-" + ev.end_line : "") : "");
          return '<div class="evidence-row">' + (ev.label ? "<strong>" + escapeHtml(ev.label) + "</strong><br>" : "") + escapeHtml(loc) + "</div>";
        }).join("")
      : "";
    return (
      '<div class="concept">' +
      "<h4>" + escapeHtml(c.name) + "</h4>" +
      "<p>" + escapeHtml(c.purpose) + "</p>" +
      '<div class="concept-field"><b>' + t("conceptWhen") + "</b><span>" + escapeHtml(c.whenUsed || "") + "</span></div>" +
      '<div class="concept-field"><b>' + t("conceptProps") + "</b><span>" + propsHtml + "</span></div>" +
      '<div class="concept-field"><b>' + t("conceptRel") + "</b><span>" + relHtml + "</span></div>" +
      '<div class="concept-field"><b>' + t("conceptCard") + "</b><span>" + escapeHtml(c.cardinality || "") + "</span></div>" +
      '<div class="concept-field"><b>' + t("conceptIO") + "</b><span>" + ioLine + "</span></div>" +
      '<div class="concept-field"><b>' + t("conceptLifecycle") + "</b><span>" + escapeHtml(c.lifecycle || "") + "</span></div>" +
      '<div class="concept-field"><b>' + t("conceptExample") + "</b><span>" + escapeHtml(c.example || "") + "</span></div>" +
      (evidenceHtml ? '<div class="concept-field"><b>' + t("capEvidence") + "</b><span>" + evidenceHtml + "</span></div>" : "") +
      "</div>"
    );
  }

  var CAP_SUBTABS = ["overview", "elements", "process", "relationships", "implementation"];
  var capActiveTab = "overview";

  function renderCapDetail(capId){
    var lang = state.lang;
    var detailEl = document.getElementById("cap-detail");
    if (!capId || !window.CAPABILITIES[capId]) {
      detailEl.innerHTML = '<p class="empty">' + escapeHtml(t("selectCapability")) + "</p>";
      return;
    }
    var cap = window.CAPABILITIES[capId];
    var data = cap[lang];
    var tabLabelKeys = { overview: "tabOverview", elements: "tabElements", process: "tabProcess", relationships: "tabRelationships", implementation: "tabImplementation" };

    var html = "";
    html += '<div class="detail-title"><span class="' + kindDotClass(cap.kind) + '"></span><h2>' + escapeHtml(CAPABILITY_NAMES[capId][lang]) + "</h2></div>";

    html += '<div class="seg" id="cap-subtabs" role="tablist" style="margin-bottom:16px;">' + CAP_SUBTABS.map(function(tab){
      return '<button type="button" data-cap-tab="' + tab + '" aria-pressed="' + (tab === capActiveTab) + '">' + escapeHtml(t(tabLabelKeys[tab])) + "</button>";
    }).join("") + "</div>";

    // OVERVIEW panel: level1 (plain language) + level3 (conceptual relationships) summary
    html += '<div class="cap-tab-panel" data-tab="overview"' + (capActiveTab!=="overview"?' style="display:none;"':'') + '>';
    html += '<div class="lvl-card"><h3>' + t("capLevel1") + "</h3>";
    html += "<p>" + escapeHtml(data.level1.what) + "</p>";
    html += "<p><b>" + t("capValue") + ":</b> " + escapeHtml(data.level1.value) + "</p>";
    html += '<div class="concept-field"><b>' + t("capInputs") + '</b><span><ul>' + data.level1.inputs.map(function(i){ return "<li>" + escapeHtml(i) + "</li>"; }).join("") + "</ul></span></div>";
    html += '<div class="concept-field"><b>' + t("capOutputs") + '</b><span><ul>' + data.level1.outputs.map(function(o){ return "<li>" + escapeHtml(o) + "</li>"; }).join("") + "</ul></span></div>";
    html += "</div>";
    html += '<div class="lvl-card"><h3>' + t("capLevel3") + "</h3><p>" + escapeHtml(data.level3) + "</p></div>";
    html += "</div>";

    // ELEMENTS panel: level2 concepts + authoring (creation modes + requiredness)
    html += '<div class="cap-tab-panel" data-tab="elements"' + (capActiveTab!=="elements"?' style="display:none;"':'') + '>';
    if (data.authoring) {
      html += '<div class="lvl-card"><h3>' + t("capAuthoring") + "</h3>" + renderAuthoring(data.authoring, lang) + "</div>";
    }
    html += '<div class="lvl-card"><h3>' + t("capLevel2") + "</h3>";
    html += data.level2.map(function(c){ return renderConcept(c, lang); }).join("");
    html += "</div>";
    html += "</div>";

    // PROCESS panel: level4 narrative + the inline capability-scoped process (if any) + related processes
    html += '<div class="cap-tab-panel" data-tab="process"' + (capActiveTab!=="process"?' style="display:none;"':'') + '>';
    html += '<div class="lvl-card"><h3>' + t("capLevel4") + "</h3><p>" + escapeHtml(data.level4) + "</p></div>";
    var relatedProcs = (window.PROCESSES || []).filter(function(p){ return p.capabilities.indexOf(capId) !== -1; });
    if (relatedProcs.length) {
      html += '<div class="lvl-card"><h3>' + t("capRelatedProcesses") + "</h3>";
      html += relatedProcs.map(function(p){
        return '<button type="button" class="ghost-btn small related-link" data-goto-proc="' + p.id + '">' + escapeHtml(p[lang].title) + " →</button>";
      }).join("");
      html += "</div>";
    }
    html += "</div>";

    // RELATIONSHIPS panel: level5 incoming/outgoing
    html += '<div class="cap-tab-panel" data-tab="relationships"' + (capActiveTab!=="relationships"?' style="display:none;"':'') + '>';
    html += '<div class="lvl-card"><h3>' + t("capLevel5") + "</h3>";
    html += '<div class="concept-field"><b>' + t("capIncoming") + '</b><span><ul>' + data.level5.incoming.map(function(i){ return "<li>" + escapeHtml(i) + "</li>"; }).join("") + "</ul></span></div>";
    html += '<div class="concept-field"><b>' + t("capOutgoing") + '</b><span><ul>' + data.level5.outgoing.map(function(o){ return "<li>" + escapeHtml(o) + "</li>"; }).join("") + "</ul></span></div>";
    html += "</div></div>";

    // IMPLEMENTATION panel: level6
    html += '<div class="cap-tab-panel" data-tab="implementation"' + (capActiveTab!=="implementation"?' style="display:none;"':'') + '>';
    html += '<div class="lvl-card"><h3>' + t("capLevel6") + "</h3>";
    html += "<p><b>" + t("capRuntime") + ":</b> " + escapeHtml(data.level6.runtime) + "</p>";
    html += '<div class="concept-field"><b>' + t("capServices") + '</b><span><ul>' + data.level6.services.map(function(s){ return "<li>" + escapeHtml(s) + "</li>"; }).join("") + "</ul></span></div>";
    html += '<div class="concept-field"><b>' + t("capApis") + '</b><span><ul>' + data.level6.apis.map(function(a){ return "<li>" + escapeHtml(a) + "</li>"; }).join("") + "</ul></span></div>";
    html += '<div class="concept-field"><b>' + t("capEvidence") + "</b><span>" + data.level6.sources.map(function(ev){
      var loc = ev.path + (ev.line ? ":" + ev.line + (ev.end_line ? "-" + ev.end_line : "") : "");
      return '<div class="evidence-row">' + (ev.label ? "<strong>" + escapeHtml(ev.label) + "</strong><br>" : "") + escapeHtml(loc) + "</div>";
    }).join("") + "</span></div>";
    html += "</div></div>";

    detailEl.innerHTML = html;
  }

  // ---------------------------------------------------------------------
  // PROCESSES view
  // ---------------------------------------------------------------------
  function renderProcCard(p, lang){
    var active = state.selectedProcess === p.id;
    return '<div class="nav-card' + (active ? " active" : "") + '" data-proc-id="' + p.id + '">' +
      '<div class="nav-kind">' + p.capabilities.length + (lang === "es" ? " capacidades" : " capabilities") + '</div>' +
      '<div class="nav-title">' + escapeHtml(p[lang].title) + '</div>' +
    '</div>';
  }

  function renderProcList(){
    var lang = state.lang;
    var listEl = document.getElementById("proc-list");
    var all = window.PROCESSES || [];
    var byCapability = all.filter(function(p){ return p.capabilities.length === 1; });
    var cross = all.filter(function(p){ return p.capabilities.length > 1; });
    var html = "";
    if (byCapability.length) {
      html += '<div class="proc-group-label">' + escapeHtml(t("byCapability")) + "</div>";
      html += byCapability.map(function(p){ return renderProcCard(p, lang); }).join("");
    }
    if (cross.length) {
      html += '<div class="proc-group-label">' + escapeHtml(t("crossCapability")) + "</div>";
      html += cross.map(function(p){ return renderProcCard(p, lang); }).join("");
    }
    listEl.innerHTML = html;
    if (!state.selectedProcess && all.length) {
      state.selectedProcess = all[0].id;
    }
  }

  function renderProcDetail(procId){
    var lang = state.lang;
    var detailEl = document.getElementById("proc-detail");
    var proc = (window.PROCESSES || []).filter(function(p){ return p.id === procId; })[0];
    if (!proc) {
      detailEl.innerHTML = '<p class="empty">' + escapeHtml(t("selectProcess")) + "</p>";
      return;
    }
    var html = "";
    html += '<div class="detail-title"><h2>' + escapeHtml(proc[lang].title) + "</h2></div>";

    html += '<div class="flow-start"><div class="flow-kicker">' + t("procTrigger") + "</div>" + escapeHtml(proc[lang].trigger) + "</div>";
    html += '<div class="lvl-card" style="margin-bottom:18px;"><h3>' + t("procStart") + "</h3><p>" + escapeHtml(proc[lang].startState) + "</p></div>";

    html += '<div class="lvl-card"><h3>' + t("procStages") + "</h3>";
    html += '<div class="req-legend"><strong style="margin-right:4px;">' + t("reqLegendTitle") + ':</strong>' +
      renderRequirednessBadge("MANDATORY") + renderRequirednessBadge("OPTIONAL") + "</div>";
    html += '<div class="flow">';
    proc.stages.forEach(function(stage){
      var capId = stage.capability;
      var capName = (CAPABILITY_NAMES[capId] && CAPABILITY_NAMES[capId][lang]) || capId;
      var color = window.CAPABILITIES[capId] ? kindColor(window.CAPABILITIES[capId].kind) : "#1f8a6f";
      html += '<div class="flow-stage' + (stage.optional ? " optional" : "") + '" style="border-left-color:' + color + ';">';
      html += '<div class="stage-head"><span class="stage-cap" data-goto-cap="' + capId + '" style="cursor:pointer;text-decoration:underline;">' + escapeHtml(capName) + "</span>";
      if (stage.optional) html += '<span class="stage-opt-badge">' + t("procOptional") + "</span>";
      html += "</div>";
      html += '<div class="stage-label">' + escapeHtml(stage[lang].label) + "</div>";
      html += '<p class="stage-detail">' + escapeHtml(stage[lang].detail) + "</p>";
      html += "</div>";
    });
    html += "</div></div>";

    if (proc.branches && proc.branches.length) {
      html += '<div class="lvl-card"><h3>' + t("procBranches") + "</h3>";
      proc.branches.forEach(function(b){
        html += '<div class="flow-branch"><b>' + escapeHtml(b.fromStageId) + ":</b> " + escapeHtml(b[lang].label) + "</div>";
      });
      html += "</div>";
    }

    html += '<div class="flow-result"><div class="flow-kicker">' + t("procResult") + "</div>" + escapeHtml(proc.result[lang]) + "</div>";

    if (proc.evidence && proc.evidence.length) {
      html += '<div class="lvl-card"><h3>' + t("procEvidence") + "</h3>";
      html += proc.evidence.map(function(ev){
        var loc = ev.path + (ev.line ? ":" + ev.line + (ev.end_line ? "-" + ev.end_line : "") : "");
        return '<div class="evidence-row">' + (ev.label ? "<strong>" + escapeHtml(ev.label) + "</strong><br>" : "") + escapeHtml(loc) + "</div>";
      }).join("");
      html += "</div>";
    }

    if (proc.archifyDiagram) {
      html += '<p><a class="ghost-btn small" target="_blank" rel="noopener" href="' + escapeHtml(proc.archifyDiagram[lang]) + '">' + escapeHtml(t("procOpenDiagram")) + " ↗</a></p>";
    }

    detailEl.innerHTML = html;
  }

  // ---------------------------------------------------------------------
  // Events
  // ---------------------------------------------------------------------
  function wireEvents(){
    document.getElementById("section-seg").addEventListener("click", function(e){
      var btn = e.target.closest("button[data-section]");
      if (!btn) return;
      state.section = btn.dataset.section;
      saveState(); renderChrome(); renderSection();
    });
    document.getElementById("level-seg").addEventListener("click", function(e){
      var btn = e.target.closest("button[data-level]");
      if (!btn) return;
      state.level = btn.dataset.level;
      saveState(); renderChrome();
    });
    document.getElementById("lang-seg").addEventListener("click", function(e){
      var btn = e.target.closest("button[data-lang]");
      if (!btn) return;
      state.lang = btn.dataset.lang;
      saveState(); renderChrome(); renderSection();
    });
    document.getElementById("toggle-sidebar").addEventListener("click", function(){
      state.sidebarOpen = !state.sidebarOpen;
      saveState(); renderChrome();
    });
    document.getElementById("comp-search").addEventListener("input", function(e){
      renderComponentList(e.target.value);
    });
    document.getElementById("comp-list").addEventListener("click", function(e){
      var btn = e.target.closest("button[data-goto-cap]");
      if (!btn) return;
      state.section = "capabilities"; state.selectedCapability = btn.dataset.gotoCap; capActiveTab = "overview";
      saveState(); renderChrome(); renderSection();
    });
    document.getElementById("cap-list").addEventListener("click", function(e){
      var card = e.target.closest(".nav-card[data-cap-id]");
      if (!card) return;
      state.selectedCapability = card.dataset.capId; capActiveTab = "overview";
      saveState(); renderCapList(); renderCapDetail(state.selectedCapability);
    });
    document.getElementById("cap-detail").addEventListener("click", function(e){
      var tabBtn = e.target.closest("button[data-cap-tab]");
      if (tabBtn) {
        capActiveTab = tabBtn.dataset.capTab;
        renderCapDetail(state.selectedCapability);
        return;
      }
      var btn = e.target.closest("button[data-goto-proc]");
      if (!btn) return;
      state.section = "processes"; state.selectedProcess = btn.dataset.gotoProc;
      saveState(); renderChrome(); renderSection();
    });
    document.getElementById("proc-list").addEventListener("click", function(e){
      var card = e.target.closest(".nav-card[data-proc-id]");
      if (!card) return;
      state.selectedProcess = card.dataset.procId;
      saveState(); renderProcList(); renderProcDetail(state.selectedProcess);
    });
    document.getElementById("proc-detail").addEventListener("click", function(e){
      var el = e.target.closest("[data-goto-cap]");
      if (!el) return;
      state.section = "capabilities"; state.selectedCapability = el.dataset.gotoCap; capActiveTab = "overview";
      saveState(); renderChrome(); renderSection();
    });
  }

  renderChrome();
  renderSection();
  wireEvents();
})();
</script>
</body>
</html>
