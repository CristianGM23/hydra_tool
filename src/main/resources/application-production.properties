# Production/trusted profile. Secrets must come from environment/external configuration.
spring.main.headless=true
dsl.projects.local.native-path-picker-enabled=false
hydra.remote-auth.allow-loopback-http=false
dsl.portability.packages.require-signature=true
hydra.configuration.technical-settings-enabled=false

hydra.remote-auth.allow-ui-provider-setup=false

# Fail closed by default; set HYDRA_SERVER_ADDRESS explicitly only behind a trusted reverse proxy/network boundary.
server.address=${HYDRA_SERVER_ADDRESS:127.0.0.1}
