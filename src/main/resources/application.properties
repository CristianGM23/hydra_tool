# -------------------------------------------------------------------
# APLICACIÓN
# -------------------------------------------------------------------

# Nombre lógico de la aplicación. También aparece en los logs.
spring.application.name=HYDRA


# -------------------------------------------------------------------
# SERVIDOR HTTP Y CICLO DE VIDA
# -------------------------------------------------------------------

# Puerto del backend Spring Boot.
server.port=8081
# Desktop remains the default, but deployable profiles can override headless/native behavior.
spring.main.headless=false
spring.profiles.default=desktop-local

# Permite terminar las peticiones activas antes de detener el servidor.
server.shutdown=graceful

# Tiempo máximo concedido a cada fase del apagado ordenado.
spring.lifecycle.timeout-per-shutdown-phase=30s


# -------------------------------------------------------------------
# DIRECTORIOS DE TRABAJO
# -------------------------------------------------------------------

# Metamodelos persistidos:
# - <id>.ecore
# - <id>.metamodel.json
# - <id>.metamodel-diagram.json
dsl.storage.metamodels=./data/metamodels

# Instancias de modelos creadas con los metamodelos.
dsl.storage.models=./data/models

# Definiciones de notaciones gráficas.
dsl.storage.notations=./data/notations

# Reglas y configuraciones de validación.
dsl.storage.validations=./data/validations

# Definiciones o recursos de quick fixes.
dsl.storage.quick-fixes=./data/quickfixes

# Plantillas y configuraciones de generadores.
dsl.storage.generators=./data/generators

# Iconos, imágenes y otros recursos visuales.
dsl.storage.assets=./data/assets

# Directorio reservado para exportaciones persistidas.
# Las exportaciones actuales se generan normalmente en memoria y se descargan.
dsl.storage.exports=./data/exports

# Crea automáticamente los directorios anteriores cuando no existen.
dsl.storage.create-directories=true


# -------------------------------------------------------------------
# ADAPTADOR ENTRE EL NÚCLEO NEUTRAL Y ECORE
# -------------------------------------------------------------------

# Valores admitidos:
# - JAVA_OBJECT_WITH_ANNOTATION: adapta el tipo externo a EJavaObject
#   y conserva su nombre original mediante anotaciones.
# - FAIL: rechaza la conversión cuando Ecore no puede representar el tipo.
dsl.adapters.ecore.external-type-policy=JAVA_OBJECT_WITH_ANNOTATION

# Conserva en EAnnotation la información neutral que Ecore no representa directamente.
dsl.adapters.ecore.preserve-neutral-annotations=true

# Registra advertencias cuando una transformación necesita una adaptación.
dsl.adapters.ecore.report-adaptations=true

# Mapeos opcionales de tipos primitivos neutrales a tipos Ecore.
# Solo deben declararse cuando se quiera cambiar el mapeo predeterminado.
# dsl.adapters.ecore.primitive-mappings.STRING=EString
# dsl.adapters.ecore.primitive-mappings.INTEGER=EInt


# -------------------------------------------------------------------
# IMPORTACIÓN
# -------------------------------------------------------------------

# Activa o desactiva todos los endpoints de importación.
dsl.imports.metamodel.enabled=true

# Límite interno del importador: 10 MiB.
dsl.imports.metamodel.max-file-size-bytes=10485760

# Detecta el formato mediante la extensión y el contenido.
dsl.imports.metamodel.auto-detect=true

# false permite importaciones con pérdida controlada y advertencias.
# true rechaza importaciones que no puedan recuperar toda la información.
dsl.imports.metamodel.strict-by-default=false

# Número de columnas del layout automático para formatos sin coordenadas.
dsl.imports.metamodel.layout-columns=4

# Separación horizontal entre elementos del layout automático.
dsl.imports.metamodel.layout-horizontal-gap=70

# Separación vertical entre elementos del layout automático.
dsl.imports.metamodel.layout-vertical-gap=70

# Solo los metamodelos con más clases que este umbral conservan rutas ortogonales durante la importación.
# Con 14 clases se usan conexiones normales; con 15 o más se usan las rutas ortogonales disponibles.
dsl.imports.metamodel.orthogonal-routing-class-threshold=14

# Identificadores de formatos permitidos.
# No son extensiones, sino los IDs registrados por el backend.
dsl.imports.metamodel.allowed-formats=ecore,emf,xmi,json,xml,drawio,langium,xtext,antlr,java,typescript,javascript,go,python,glsp,plantuml,markdown,markdown-agent


# -------------------------------------------------------------------
# SUBIDA DE ARCHIVOS MULTIPART
# -------------------------------------------------------------------

# Límite de un archivo individual.

# Debe ser algo mayor que max-file-size porque la petición multipart
# también contiene cabeceras y separadores.


# -------------------------------------------------------------------
# ACTUATOR
# -------------------------------------------------------------------

# Solo publica los endpoints de salud e información.
management.endpoints.web.exposure.include=health,info

# No muestra detalles internos de componentes en el endpoint de salud.
management.endpoint.health.show-details=never

# Permite que las propiedades info.* aparezcan en /actuator/info.
management.info.env.enabled=true

# Información básica visible en /actuator/info.
info.app.name=${spring.application.name}
info.app.description=HYbrid DSL & Representation Architecture

# -------------------------------------------------------------------
# ANÁLISIS ASÍNCRONO DE IMPORTACIONES
# -------------------------------------------------------------------

# Hilos mantenidos normalmente para analizar archivos.
dsl.imports.metamodel.analysis-core-pool-size=2

# Número máximo de análisis ejecutados al mismo tiempo.
dsl.imports.metamodel.analysis-max-pool-size=4

# Trabajos que pueden esperar cuando todos los hilos están ocupados.
dsl.imports.metamodel.analysis-queue-capacity=20

# Minutos durante los que se conserva el resultado para el sondeo del frontend.
dsl.imports.metamodel.analysis-retention-minutes=20
# Maximum completed/failed analysis jobs retained in memory in addition to time-based cleanup.
dsl.imports.metamodel.analysis-max-retained-jobs=${HYDRA_IMPORT_ANALYSIS_MAX_RETAINED_JOBS:64}
# Bounded activity/log retention for large and adversarial imports.
dsl.imports.metamodel.analysis-maximum-activity-messages=${HYDRA_IMPORT_ANALYSIS_MAX_ACTIVITY_MESSAGES:2000}
dsl.imports.metamodel.analysis-maximum-activity-detail-characters=${HYDRA_IMPORT_ANALYSIS_MAX_ACTIVITY_DETAIL_CHARS:8192}
dsl.imports.metamodel.analysis-maximum-stage-log-characters=${HYDRA_IMPORT_ANALYSIS_MAX_STAGE_LOG_CHARS:262144}
# Total deadline includes queue time; a separate watchdog prevents worker starvation from defeating it.
dsl.imports.metamodel.analysis-maximum-duration-seconds=${HYDRA_IMPORT_ANALYSIS_MAX_DURATION_SECONDS:180}
dsl.imports.metamodel.analysis-watchdog-pool-size=${HYDRA_IMPORT_ANALYSIS_WATCHDOG_POOL_SIZE:1}
dsl.imports.metamodel.analysis-shutdown-wait-seconds=${HYDRA_IMPORT_ANALYSIS_SHUTDOWN_WAIT_SECONDS:20}
# Staged uploads are streamed here before bounded parsing; prevents large multipart payloads from entering the heap.
dsl.imports.metamodel.staging-root=./data/metamodel-import-staging

# -------------------------------------------------------------------
# LAYOUT AUTOMÁTICO DE METAMODELOS
# -------------------------------------------------------------------

# Activa el servicio general de organización automática.
dsl.layout.metamodel.enabled=true

# Algoritmo predeterminado. Actualmente se registra "layered".
dsl.layout.metamodel.default-algorithm=layered

# Valores admitidos: LEFT_TO_RIGHT y TOP_TO_BOTTOM.
dsl.layout.metamodel.default-direction=LEFT_TO_RIGHT

# Margen exterior del diagrama.
dsl.layout.metamodel.margin=60

# Separación entre capas semánticas.
dsl.layout.metamodel.layer-gap=180

# Separación entre nodos de una misma capa.
dsl.layout.metamodel.node-gap=90

# Separación entre componentes desconectados.
dsl.layout.metamodel.component-gap=140

# Número de pasadas baricéntricas para reducir cruces.
dsl.layout.metamodel.crossing-reduction-passes=12

# Columnas empleadas para clases, enums y tipos aislados.
dsl.layout.metamodel.isolated-node-columns=4

# Conserva tamaños ajustados manualmente.
dsl.layout.metamodel.preserve-node-sizes=true

# Conserva colores, fuentes y estilos de relaciones.
dsl.layout.metamodel.preserve-styles=true

# Acerca enums y tipos de datos a las clases que los usan.
dsl.layout.metamodel.use-attribute-types-for-placement=true

dsl.layout.metamodel.port-assignment-algorithm=dynamic
dsl.layout.metamodel.edge-routing-algorithm=orthogonal
dsl.layout.metamodel.label-placement-algorithm=longest-segment


dsl.layout.metamodel.port-margin=18
dsl.layout.metamodel.minimum-port-gap=14
dsl.layout.metamodel.maximum-ports-per-side=24

dsl.layout.metamodel.routing-grid-size=20
dsl.layout.metamodel.routing-node-clearance=24
dsl.layout.metamodel.routing-edge-gap=8
dsl.layout.metamodel.routing-turn-cost=25
dsl.layout.metamodel.routing-crossing-cost=600
dsl.layout.metamodel.routing-congestion-cost=120
dsl.layout.metamodel.routing-maximum-expanded-states=250000
dsl.layout.metamodel.parallel-routing=true

dsl.layout.metamodel.label-clearance=8

# -------------------------------------------------------------------
# JSON
# -------------------------------------------------------------------

# Genera JSON indentado para facilitar su lectura y depuración.
spring.jackson.serialization.indent-output=true


# -------------------------------------------------------------------
# LOGGING
# -------------------------------------------------------------------

# Nivel general de la aplicación.
logging.level.root=INFO

# Nivel específico del código propio.
# El paquete real del proyecto es com.example.editor.
logging.level.com.example.editor=DEBUG

# Canonical MetaModel persistence configuration.
dsl.metamodel.canonical.enabled=true
dsl.metamodel.canonical.file-suffix=.metamodel.json
dsl.metamodel.canonical.use-etag=true


# Proyección Ecore regenerable desde el MetaModel canónico.
dsl.metamodel.projections.ecore.enabled=true
dsl.metamodel.projections.ecore.generation-mode=ON_SAVE
dsl.metamodel.projections.ecore.required-for-runtime=true
dsl.metamodel.projections.ecore.file-suffix=.ecore
dsl.metamodel.projections.ecore.continue-on-error=true

# -------------------------------------------------------------------
# EXPRESIONES CANONICAS
# -------------------------------------------------------------------

# Un documento ExpressionModel 1.0 por metamodelo, guardado en data/validations.
dsl.validation.expressions.enabled=true
dsl.validation.expressions.file-suffix=.expressions.json
dsl.validation.expressions.use-etag=true

# Un documento ActionModel 1.0 por metamodelo, guardado en data/validations.
dsl.validation.actions.enabled=true
dsl.validation.actions.file-suffix=.actions.json
dsl.validation.actions.use-etag=true

# Un documento ValidationModel 1.0 por metamodelo, guardado en data/validations.
dsl.validation.rules.enabled=true
dsl.validation.rules.file-suffix=.validations.json
dsl.validation.rules.use-etag=true

dsl.metamodel.operations.enabled=true
dsl.metamodel.operations.file-suffix=.operation-behaviors.json
dsl.metamodel.operations.use-etag=true


# -------------------------------------------------------------------
# EVENTOS CANÓNICOS Y EDITORES CONFIGURABLES
# -------------------------------------------------------------------

# Definiciones y bindings de eventos personalizados.
dsl.events.enabled=true
dsl.events.directory=./data/events
dsl.events.definition-file-suffix=.event-definitions.json
dsl.events.binding-file-suffix=.event-bindings.json
dsl.events.diagram-file-suffix=.event-architecture-diagram.json
dsl.events.use-etag=true

# Definiciones de editores de modelos. La paleta fija del diseñador de
# metamodelos no se almacena aquí. Cada documento representa un editor
# configurable concreto construido sobre un metamodelo.
dsl.editors.enabled=true
dsl.editors.directory=./data/editors
dsl.editors.file-suffix=.editor.json
dsl.editors.use-etag=true

# -------------------------------------------------------------------
# PERFILES DE INTEGRACIÓN E INYECCIÓN
# -------------------------------------------------------------------

# Configuraciones portables para generar módulos, plugins, paquetes,
# sidecars o proyecciones dirigidas a herramientas ya existentes.
dsl.integrations.enabled=true
dsl.integrations.directory=./data/integrations
dsl.integrations.file-suffix=.integration.json
dsl.integrations.use-etag=true

dsl.validation.runtime.enabled=true
dsl.validation.runtime.max-cached-plans=256
dsl.validation.runtime.allow-partial-plan-execution=true
dsl.validation.runtime.drawio-enabled=true

# -------------------------------------------------------------------
# PROYECTOS LOCALES Y PROJECT EXPLORER
# -------------------------------------------------------------------

# Permite crear, abrir, editar, importar y exportar proyectos locales completos.
dsl.projects.local.enabled=true

# Registro local de proyectos recientes y última sesión. No forma parte de los proyectos portables.
dsl.projects.local.registry-directory=./data/projects

# Tamaño máximo de un archivo que puede editarse como texto desde Project Explorer.
dsl.projects.local.max-editable-file-size-bytes=5242880

# Tamaño máximo de un archivo subido o guardado individualmente.
dsl.projects.local.max-upload-file-size-bytes=26214400

# Tamaño máximo de un proyecto ZIP, comprimido y expandido.
dsl.projects.local.max-archive-size-bytes=262144000

# Profundidad máxima del árbol del proyecto.
dsl.projects.local.max-tree-depth=48
dsl.projects.local.max-tree-entries=20000

# Activa la detección por snapshots de cambios externos.
dsl.projects.local.change-detection-enabled=true

# Los enlaces simbólicos se rechazan para evitar salir de la raíz del proyecto.
dsl.projects.local.allow-symbolic-links=false

# Número máximo de proyectos recientes recordados.
dsl.projects.local.recent-project-limit=20
# Número máximo de entradas aceptadas dentro de un ZIP para evitar archivos maliciosos.
dsl.projects.local.max-archive-entries=10000

# Número máximo de coincidencias devueltas por una búsqueda del proyecto.
dsl.projects.local.max-search-results=200


# Permite abrir un selector nativo de archivos y directorios cuando backend y navegador se ejecutan en el mismo equipo.
dsl.projects.local.native-path-picker-enabled=true
# Impide que un cliente remoto abra diálogos del sistema operativo en la máquina que ejecuta el backend.
dsl.projects.local.native-path-picker-local-only=true

dsl.validation.orchestration.enabled=true
dsl.validation.orchestration.max-tracked-models=256
dsl.validation.orchestration.block-save-on-errors=true
dsl.validation.orchestration.block-export-on-errors=true

# -------------------------------------------------------------------
# EVENT FLOWS E2/F0 + F1/F2
# -------------------------------------------------------------------
dsl.events.flows.enabled=true
dsl.events.flows.directory=./data/event-flows
dsl.events.flows.file-suffix=.event-flows.json
dsl.events.flows.diagram-file-suffix=.event-flow-diagram.json
dsl.events.flows.use-etag=true
dsl.events.flows.runtime-file-suffix=.event-flow-runtime.json
dsl.events.flows.maximum-execution-traces=200
dsl.events.flows.maximum-execution-depth=32
dsl.events.flows.maximum-runtime-states=256
# Bounds local runtime deployments; inactive deployments are evicted before active ones are ever considered.
dsl.events.flows.maximum-runtime-deployments=128

# -------------------------------------------------------------------
# GAMIFICACIÓN OPCIONAL G0-G4
# -------------------------------------------------------------------
dsl.gamification.enabled=true
dsl.gamification.directory=./data/gamification
dsl.gamification.definition-file-suffix=.gamification-definitions.json
dsl.gamification.binding-file-suffix=.gamification-bindings.json
dsl.gamification.state-file-suffix=.gamification-state.json
dsl.gamification.ledger-file-suffix=.gamification-ledger.json
dsl.gamification.diagram-file-suffix=.gamification-diagram.json
dsl.gamification.use-etag=true
dsl.gamification.maximum-ledger-entries=10000

# Neutral runtime sessions for configurable model editors
dsl.editors.runtime.maximum-cached-plans=256
dsl.editors.runtime.sessions.enabled=true
dsl.editors.runtime.sessions.directory=./data/editor-sessions
dsl.editors.runtime.sessions.file-suffix=.editor-session.json
dsl.editors.runtime.sessions.diagram-file-suffix=.editor-session-diagram.json
dsl.editors.runtime.sessions.use-etag=true
dsl.editors.runtime.sessions.maximum-history-entries=50
dsl.editors.runtime.sessions.maximum-history-sessions-in-memory=8
dsl.editors.runtime.sessions.maximum-working-copies-in-memory=16
dsl.editors.runtime.sessions.maximum-pending-events-in-memory=256
dsl.editors.runtime.sessions.maximum-pending-event-sessions=16
dsl.editors.runtime.sessions.maximum-pending-event-fallback-events=512
dsl.editors.runtime.sessions.maximum-pending-event-spool-bytes-per-session=16777216
# Optional override; by default HYDRA uses <session directory>/.pending-events
# dsl.editors.runtime.sessions.pending-event-spool-directory=./data/editor-sessions/.pending-events
dsl.imports.metamodel.max-archive-entries=5000
dsl.imports.metamodel.max-archive-uncompressed-bytes=104857600
dsl.imports.metamodel.max-source-file-size-bytes=5242880
dsl.imports.metamodel.max-source-files=2000
dsl.imports.metamodel.python.executable=python
dsl.imports.metamodel.python.timeout-seconds=12
dsl.imports.metamodel.python.maximum-output-bytes=4194304
dsl.imports.metamodel.python.fallback-enabled=true
dsl.imports.metamodel.python.maximum-concurrent-processes=2
dsl.imports.metamodel.python.process-acquire-timeout-seconds=5
dsl.imports.metamodel.python.output-collection-timeout-millis=${HYDRA_PYTHON_OUTPUT_COLLECTION_TIMEOUT_MILLIS:5000}
dsl.imports.metamodel.python.process-termination-grace-millis=${HYDRA_PYTHON_TERMINATION_GRACE_MILLIS:500}
dsl.imports.metamodel.python.process-termination-force-wait-millis=${HYDRA_PYTHON_TERMINATION_FORCE_WAIT_MILLIS:1500}
dsl.imports.metamodel.python.process-termination-maximum-passes=${HYDRA_PYTHON_TERMINATION_MAX_PASSES:4}
dsl.imports.metamodel.python.process-tree-observation-interval-millis=${HYDRA_PYTHON_PROCESS_TREE_OBSERVATION_MILLIS:5}

# -------------------------------------------------------------------
# -------------------------------------------------------------------
dsl.portability.packages.enabled=true
dsl.portability.packages.cache-directory=./data/capability-packages/cache
dsl.portability.packages.maximum-archive-bytes=134217728
dsl.portability.packages.maximum-entry-bytes=33554432
dsl.portability.packages.maximum-entries=4096
dsl.portability.packages.cache-enabled=true
dsl.portability.packages.require-signature=false
# Para firmar y verificar con HMAC-SHA256, definir mediante variable de entorno o configuración externa.
dsl.portability.packages.signature-secret=
dsl.portability.packages.signature-key-id=local

dsl.standalone.editors.enabled=true
dsl.standalone.editors.maximum-archive-bytes=104857600
dsl.standalone.editors.maximum-generated-model-bytes=10485760
dsl.standalone.editors.maximum-entries=512
dsl.standalone.editors.default-port=4173
dsl.standalone.editors.default-runtime-base-url=http://localhost:8081


# -------------------------------------------------------------------
# -------------------------------------------------------------------
dsl.integrations.injection.enabled=true
dsl.integrations.injection.allowed-root=./data/injection-targets
dsl.integrations.injection.maximum-files=4096
dsl.integrations.injection.maximum-total-bytes=134217728
dsl.integrations.injection.maximum-file-bytes=33554432
dsl.integrations.round-trip.maximum-file-bytes=${HYDRA_ROUND_TRIP_MAXIMUM_FILE_BYTES:33554432}

# Las versiones y nombres se configuran por IntegrationProfileModel.target.settings.
# Xtext: basePackage, languageName, xtextVersion.
# Langium: packageName, languageName, fileExtension, langiumVersion, typescriptVersion.
# Eclipse GLSP: packageName, diagramType, serverLanguage (java|typescript), basePackage, glspVersion, typescriptVersion.
# BESSER SDK: pythonModule, besserVersion.
# BESSER WME: packageName, diagramType, wmeVersion.

# -------------------------------------------------------------------
# -------------------------------------------------------------------
dsl.integrations.validation.enabled=true
dsl.integrations.validation.workspace-root=./data/integration-validation
dsl.integrations.validation.default-timeout-seconds=180
dsl.integrations.validation.maximum-files=8192
dsl.integrations.validation.maximum-total-bytes=268435456
dsl.integrations.validation.maximum-process-output-bytes=2097152
dsl.integrations.validation.maximum-concurrent-processes=2
dsl.integrations.validation.process-acquire-timeout-seconds=5
dsl.integrations.validation.process-output-join-timeout-seconds=${HYDRA_VALIDATION_PROCESS_OUTPUT_JOIN_TIMEOUT_SECONDS:3}
dsl.integrations.validation.process-termination-grace-millis=${HYDRA_VALIDATION_TERMINATION_GRACE_MILLIS:500}
dsl.integrations.validation.process-termination-force-wait-millis=${HYDRA_VALIDATION_TERMINATION_FORCE_WAIT_MILLIS:1500}
dsl.integrations.validation.process-termination-maximum-passes=${HYDRA_VALIDATION_TERMINATION_MAX_PASSES:4}
dsl.integrations.validation.process-tree-observation-interval-millis=${HYDRA_VALIDATION_PROCESS_TREE_OBSERVATION_MILLIS:5}
# La validación estructural no descarga dependencias. La validación nativa ejecuta
# los comandos declarados por cada adaptador con timeout, salida acotada y circuit breaker.
# Round-trip conserva mappings, hashes y regiones manuales explícitas.
# PlantUML y Draw.io son proyecciones; el JSON canónico embebido permite recuperación exacta.

# -------------------------------------------------------------------
# -------------------------------------------------------------------
# Informe más reciente generado por el centro de verificación nativa.
hydra.compatibility.report-root=./data
# Raíz segura bajo la que el centro de distribución materializa editores.
hydra.standalone-distribution.allowed-root=./data/standalone-editors

# -------------------------------------------------------------------
# IMPORTACIÓN DE UPDATE SITES ECLIPSE / P2
# -------------------------------------------------------------------

# Activa el análisis seguro de repositorios p2 empaquetados o directorios.
dsl.imports.update-site.enabled=true

# Límites independientes del importador convencional de un único metamodelo.
dsl.imports.update-site.max-upload-bytes=268435456
dsl.imports.update-site.max-entries=50000
dsl.imports.update-site.max-uncompressed-bytes=1073741824
dsl.imports.update-site.max-entry-bytes=67108864
dsl.imports.update-site.max-nested-archive-depth=2
dsl.imports.update-site.max-provenance-elements=20000

# Paquetes de procedencia, confianza y capas neutrales recuperadas.
dsl.imports.update-site.storage-root=./data/update-site-imports

# Un update site puede contener numerosos bundles. El servicio mantiene límites
# internos adicionales y nunca ejecuta código de los plug-ins subidos.
spring.servlet.multipart.max-file-size=256MB
spring.servlet.multipart.max-request-size=300MB
# incluso cuando el update site contiene miles de recursos.
dsl.imports.update-site.max-import-log-entries=5000
dsl.imports.update-site.max-file-outcomes=10000
dsl.imports.update-site.max-reconciliation-candidates=8

# -------------------------------------------------------------------
# -------------------------------------------------------------------
# El acceso remoto permanece desactivado y sin hosts permitidos por defecto.
dsl.imports.update-site.remote-enabled=false
# remote-allowed-hosts se omite deliberadamente: el valor Java por defecto es una allowlist vacía.
# Debe configurarse explícitamente como lista separada por comas al activar el acceso remoto.
dsl.imports.update-site.remote-connect-timeout-millis=5000
dsl.imports.update-site.remote-request-timeout-millis=15000
dsl.imports.update-site.remote-max-bytes=67108864
dsl.imports.update-site.remote-max-total-bytes=268435456
dsl.imports.update-site.remote-max-repositories=32
dsl.imports.update-site.remote-max-depth=4
dsl.imports.update-site.remote-max-resources=1024
dsl.imports.update-site.remote-max-artifacts=256
dsl.imports.update-site.remote-cache-enabled=true
dsl.imports.update-site.remote-cache-directory=./data/update-site-imports/remote-cache
# Caché LRU de análisis inmutables; 0 la desactiva sin cambiar contratos HTTP.
dsl.imports.update-site.analysis-cache-entries=8
# Caducidad de entradas de análisis para evitar retener grafos obsoletos indefinidamente.
dsl.imports.update-site.analysis-cache-ttl-seconds=900
# Protección adicional frente a archive bombs y análisis desproporcionados.
dsl.imports.update-site.max-compression-ratio=200
dsl.imports.update-site.max-archive-read-millis=120000
# CPU budget for archive expansion/parsing on the analysis thread.
dsl.imports.update-site.max-archive-cpu-millis=60000
# Retención y número máximo de snapshots de repositorio.
dsl.imports.update-site.repository-snapshot-max-count=32
dsl.imports.update-site.repository-snapshot-retention-hours=24
# Límites del formato seguro *.hydra-adapter.json.
dsl.imports.update-site.max-declarative-adapters=128
