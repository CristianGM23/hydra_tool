# Deterministic CI/test profile
spring.main.headless=true
dsl.projects.local.native-path-picker-enabled=false
hydra.remote-auth.allow-loopback-http=true
dsl.portability.packages.require-signature=false
hydra.configuration.technical-settings-enabled=true

hydra.remote-auth.allow-ui-provider-setup=true

# Los tests pueden crear varios contextos aislados dentro de la misma JVM.
hydra.instance-lock.enabled=false
