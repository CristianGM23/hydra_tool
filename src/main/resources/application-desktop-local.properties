# HYDRA desktop/local profile
# Desktop mode is intentionally local-only; server profiles must opt into external binding.
server.address=127.0.0.1
spring.main.headless=false
dsl.projects.local.native-path-picker-enabled=true
dsl.projects.local.native-path-picker-local-only=true
hydra.remote-auth.allow-loopback-http=true
dsl.portability.packages.require-signature=false
hydra.configuration.technical-settings-enabled=true

hydra.remote-auth.allow-ui-provider-setup=true

# Desktop installations can keep provider tokens in an owner-only local AES-256-GCM vault.
hydra.remote-auth.vault.allow-protected-local-master-key=true
