name: HYDRA full-tree gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: oracle, java-version: '25.0.5', cache: maven }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '26.12.1', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.15.2' }
      - name: Canonical source integrity (cross-platform checkout)
        run: python scripts/validation/verify_manifest.py --allow-extra
      - name: Qualification Python dependencies
        run: python -m pip install --disable-pip-version-check --requirement scripts/release/qualification-requirements.txt
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci && npx playwright install chromium
      - name: Frontend full gate
        working-directory: frontend
        run: npm run build && npm test -- --run && npm run lint
      - name: Backend full gate
        run: bash ./mvnw -B clean verify
        shell: bash
      - name: Generated-editor B+D block 2 integration checks
        run: python scripts/validation/verify_bd_block2.py
      - name: Generated-editor behavioral smoke
        run: node --test reference-projects/bd2-standalone-smoke/scripts/editor.test.mjs
      - name: HYDRA final-tree gate
        run: python scripts/validation/verify_final_tree.py --ci
      - name: Source package and SBOM
        run: python scripts/release/package_source.py && python scripts/release/generate_sbom.py
      - name: Release qualification
        run: python scripts/release/qualify_release.py --full --ci --primary-already-verified
      - name: RC1 product qualification
        run: python scripts/release/qualify_rc1.py --full --primary-release-qualified

      - name: RC2 stabilization qualification
        run: python scripts/release/qualify_rc2.py --full --primary-rc1-qualified

      - name: Upload qualification diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hydra-qualification-diagnostics-${{ matrix.os }}
          path: |
            target/release/logs/**
            target/release/*qualification*.json
            target/release/release-readiness.json
          if-no-files-found: warn
          retention-days: 7
